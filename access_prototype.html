<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <title>OSTTRA SSO Central Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0b192c;
      color: #ffffff;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 420px;
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 1rem;
      background: #0ea5e9;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #0284c7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OSTTRA SSO Central</h1>
    <p>Redirecting you to the running prototype...</p>
    <a href="http://localhost:3000">Open Prototype (http://localhost:3000)</a>
  </div>
</body>
</html>
